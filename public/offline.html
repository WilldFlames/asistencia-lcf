<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08243d">
  <title>LCF Familias — Sin conexión</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#08243d,#176b72);font-family:Arial,sans-serif;color:#17324d}.card{width:min(100%,430px);background:#fff;border-radius:22px;padding:30px 25px;text-align:center;box-shadow:0 20px 55px #001b2e66}.icon{font-size:48px;margin-bottom:12px}h1{font-size:21px;margin:0 0 9px}p{color:#60758a;line-height:1.5;margin:0 0 20px}button{border:0;border-radius:11px;padding:12px 18px;background:#11689f;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">📶</div>
    <h1>Necesita conexión a internet</h1>
    <p>Por seguridad, LCF Familias no guarda en el teléfono la información privada de los estudiantes. Conéctese a internet y vuelva a intentarlo.</p>
    <button onclick="location.reload()">Intentar nuevamente</button>
  </main>
</body>
</html>
